name: Build JaPur Remote Share Receiver

on:
  push:
    paths:
      - 'tools/japur-share-receiver/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/japur-share-receiver
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: japur-remote-share-receiver-debug
          path: tools/japur-share-receiver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
